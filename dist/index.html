function field(name,label,value,opts={}){

function help(){
 const d=$('editor');
 d.innerHTML='<div class="dialog-top"><div><h2 id="dialog-title">Tus mapas, en tu equipo</h2><p class="hint">Compás · Prototipo local navegable</p></div>'+btn('Cerrar','close','','ghost')+'</div><div class="dialog-body"><p>Compás toma su nombre del compás magnético: una referencia para orientarte, revisar el rumbo y reconocer tus decisiones.</p><ol class="help-list"><li><strong>Empieza o explora.</strong> Usa el ejemplo ficticio o crea una bitácora nueva con tu pregunta y tu próximo hito.</li><li><strong>Traza tu ruta.</strong> Registra tu nivel y semestre. En Mi ruta, consulta los productos esperados, guarda versiones y ajusta tu plan con un motivo. La guía es un borrador de referencia.</li><li><strong>Define pasos pequeños.</strong> Usa ToDo para organizar tareas privadas y vincularlas con compromisos o productos. Completarlas no cierra otros registros.</li><li><strong>Conecta el seguimiento.</strong> Registra sesiones, vincula compromisos y conserva los cambios de rumbo como nuevas decisiones.</li><li><strong>Conserva tu trabajo.</strong> Descarga el respaldo personal JSON y vuelve a abrirlo en Compás. Puedes usarlo también en otro equipo.</li><li><strong>Comparte una selección.</strong> En Reportes, elige el contenido y revisa la vista previa. Descarga un panel de consulta, un Excel o usa “Imprimir / Guardar PDF”.</li></ol><h3>Privacidad</h3><p>Esta versión funciona sin internet y no envía el contenido a servidores. No usa analítica, fuentes remotas ni servicios de inteligencia artificial. Puede conservar una copia auxiliar en este navegador; esa copia no sustituye tu respaldo.</p><p>Las tareas ToDo, horas, reflexiones y notas privadas quedan fuera de los reportes. El respaldo personal sí las contiene y no está cifrado: consérvalo contigo. Si lo guardas en una carpeta sincronizada, también puede almacenarse en la nube.</p><p>Registra decisiones metodológicas y revisiones de avance. No incluyas entrevistas, transcripciones, bases de datos ni información que identifique a participantes o lugares sensibles. También una decisión puede revelar información confidencial.</p><h3>Reportes y revisión</h3><p>El panel de consulta es una copia con fecha de corte. No modifica tu bitácora ni recibe actualizaciones automáticas. Quien lo recibe puede conservarlo o copiarlo. La revisión registrada por el tesista no equivale a una firma o VoBo verificado.</p><h3>Respaldo</h3><p>El guardado auxiliar puede desaparecer al borrar datos del navegador o al usar navegación privada. Abrir otro respaldo o una bitácora nueva reemplaza la copia auxiliar actual.</p><div class="toolbar">'+btn('Nueva bitácora','new')+btn('Cargar ejemplo ficticio','demo')+'</div><p class="keyboard-note">Los campos con * son necesarios. La aplicación puede usarse con teclado.</p></div><div class="dialog-bottom"><span class="hint">Coordinación del Posgrado en Ciencias Sociales y Políticas - Ibero</span>'+btn('Entendido','close','','primary')+'</div>';
 d.showModal();
}
function replaceState(next,label){if(dirty&&!confirm('Tienes cambios sin descargar. ¿Reemplazar la bitácora actual? Cancela para descargar primero tu respaldo.'))return false;state=next;reportOptions=null;previewShare=null;actionFilter='todos';routeLevel='';routeSemester='';todoFilter='pendientes';persist();$('editor').close();navigate('brujula');toast(label);return true;}
function prepareReport(){initReport();if(reportOptions.from&&reportOptions.to&&reportOptions.from>reportOptions.to){toast('La fecha inicial debe ser igual o anterior a la fecha de corte.');return;}previewShare=C.makeShare(state,reportOptions);if(!previewShare.project&&!previewShare.actions.length&&!previewShare.decisions.length&&!previewShare.sessions.length&&!previewShare.route.length){previewShare=null;toast('Selecciona al menos un registro o el rumbo de tu tesis.');return;}render();$('report-frame').scrollIntoView({behavior:'smooth',block:'start'});}
document.addEventListener('click',ev=>{
 const nav=ev.target.closest('[data-view]');if(nav){navigate(nav.dataset.view);return;}
 const b=ev.target.closest('[data-do]');if(!b)return;const a=b.dataset.do,id=b.dataset.id;
 if(a==='delete-record')return;
 const handlers={close:()=>$('editor').close(),help,backup,open:()=>$('backup-input').click(),project:projectForm,'route-progress':()=>routeForm(id),'route-stage':()=>{routeSemester=b.dataset.semester;render();},'todo-edit':()=>todoForm(id,b.dataset.source,b.dataset.milestone),action:()=>actionForm(id,b.dataset.source,b.dataset.milestone),session:()=>sessionForm(id,b.dataset.type),decision:()=>decisionForm(id),evolve:()=>decisionForm(null,id),time:()=>timeForm(id),reflection:()=>reflectionForm(id),new:()=>{if(replaceState(C.blank(),'Tu nueva bitácora está lista.'))projectForm();},demo:()=>replaceState(C.demo(),'Ejemplo ficticio cargado.'),preview:prepareReport,html:()=>{if(previewShare){download(C.reportHTML(previewShare),'Compas-consulta-'+(previewShare.to||C.today())+'.html','text/html;charset=utf-8');toast('Panel de consulta preparado con tu selección.');}},excel:()=>{if(previewShare){download(C.excelBytes(previewShare),'Compas-reporte-'+(previewShare.to||C.today())+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');toast('Excel preparado con los registros seleccionados.');}},pdf:()=>{const frame=$('report-frame');if(frame){try{frame.contentWindow.focus();frame.contentWindow.print();}catch(_){toast('Usa el botón Imprimir / Guardar PDF dentro de la vista previa.');}}}};
 if(handlers[a])handlers[a]();
});
document.addEventListener('change',ev=>{
 const el=ev.target;
 if(el.id==='route-level'){routeLevel=el.value;routeSemester='1';render();return;}
 if(el.id==='todo-filter'){todoFilter=el.value;render();return;}
 if(el.dataset.todoCheck){const next=C.setTodoDone(state,el.dataset.todoCheck,el.checked);mutate(s=>Object.assign(s,next));return;}
 if(el.id==='time-period'){timePeriod=el.value;render();return;}
 if(el.id==='action-filter'){actionFilter=el.value;render();return;}
 if(el.dataset.reportList){const key=el.dataset.reportList;reportOptions[key]=el.checked?[...new Set([...reportOptions[key],el.value])]:reportOptions[key].filter(x=>x!==el.value);previewShare=null;render();return;}
 const map={'report-title':'title','report-from':'from','report-to':'to','report-project':'project','report-names':'names'};
 if(map[el.id]){reportOptions[map[el.id]]=el.type==='checkbox'?el.checked:el.value;previewShare=null;if(el.id==='report-title'){const preview=document.querySelector('.report-preview');if(preview)preview.remove();}else render();}
});
$('backup-input').addEventListener('change',async ev=>{
 const file=ev.target.files[0];if(!file)return;
 try{if(file.size>C.MAX_BACKUP_BYTES)throw new Error('El archivo excede el límite de 24 MB.');const next=C.restore(await file.text());replaceState(next,'Respaldo abierto. Puedes continuar tu trayectoria.');}catch(err){toast(err.message);}finally{ev.target.value='';}
});
window.addEventListener('beforeunload',ev=>{if(dirty){ev.preventDefault();ev.returnValue='';}});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(Object.hasOwn(views,next)&&next!==view){view=next;render();}});
view=Object.hasOwn(views,location.hash.slice(1))?location.hash.slice(1):'brujula';render();
if(startupNotice)toast(startupNotice);
// This optional browser integration navigates only; it does not return personal records.
if(document.modelContext&&document.modelContext.registerTool){
 const lifecycle=new AbortController();
 try{Promise.resolve(document.modelContext.registerTool({name:'navigate_compas_module',title:'Abrir un módulo de Compás',description:'Abre un módulo visible de Compás. No devuelve el contenido de la bitácora ni modifica sus registros.',inputSchema:{type:'object',properties:{module:{type:'string',enum:Object.keys(views)}},required:['module'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||Object.keys(input).length!==1||!Object.hasOwn(views,input.module))throw new Error('Selecciona un módulo válido.');navigate(input.module);return {openedModule:input.module};}},{signal:lifecycle.signal})).catch(()=>{});}catch(_){}
 window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}
})();
</script>
</body>
</html>
